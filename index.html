<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automação Industrial | Maximize seu OEE e Reduza Custos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            color: #333;
            line-height: 1.6;
            background-color: #f4f7f6;
        }

        /* Header */
        header {
            background-color: #0a192f;
            color: #ffffff;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        header .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00b4d8;
        }

        .engineer-contacts {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .engineer-contacts a {
            color: #00b4d8;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .engineer-contacts a:hover {
            color: #ff6b00;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, #0a192f 0%, #1e3a8a 100%);
            color: white;
            padding: 4rem 2rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto 2rem auto;
            color: #cbd5e1;
        }

        /* Formulário de Captura */
        .cta-form {
            background-color: #ffffff;
            max-width: 500px;
            margin: 0 auto;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            color: #333;
        }

        .cta-form h3 {
            margin-bottom: 1rem;
            color: #0a192f;
        }

        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }
